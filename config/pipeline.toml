# docingest pipeline config. Any change here changes config_hash, which
# invalidates cached outputs in data/normalized/ for affected documents.

output_dir = "data/normalized"

[probe]
min_chars = 50                  # page with fewer embedded chars -> OCR
image_coverage = 0.6            # image objects covering >60% of the page...
image_coverage_max_chars = 400  # ...with little text -> OCR
max_garbage_ratio = 0.10        # >10% broken glyphs (bad font encoding) -> OCR
min_alpha_ratio = 0.5           # olmOCR heuristic: <50% letters -> suspicious text layer

[ocr]
# Vision-language model used for scanned pages and images (MLX, runs on Apple Silicon).
# Pinned to an exact Hugging Face commit for reproducibility.
repo_id = "mlx-community/Qwen3-VL-4B-Instruct-4bit"
revision = "2fd8dacbdb8f1e54b8c005f081ec5bf79c56376b"
# Higher-quality OCR-specialised alternative (Qwen2.5-VL-7B fine-tune, ~5.6 GB):
# repo_id = "mlx-community/olmOCR-2-7B-1025-mlx-4bit"
# revision = "c0eaffb7844e795a44e246744cfaba5981a1bf03"
dpi = 150
max_side = 1600
max_tokens = 4096
temperature = 0.0
repetition_penalty = 1.05
