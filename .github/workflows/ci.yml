name: ci

on:
  push:
  pull_request:

# The docingest package lives in packages/docingest; its commands run from there.
defaults:
  run:
    working-directory: packages/docingest

jobs:
  linux:
    # Core + dev only: no mlx (Apple Silicon), no PaperQA2 / Docling extras.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen ruff format --check src tests
      - run: uv run --frozen lint-imports
      - run: uv run --frozen pytest -q --cov

  macos:
    # Everything installed; model / network tests stay opt-in.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run --frozen pyright
      - run: uv run --frozen pytest -q --cov
