# docingest configuration. Settings that change a document's output feed its
# config_hash, which invalidates cached outputs in data/normalized/ automatically.

output_dir = "data/normalized"
raw_dir = "data/raw"

[adapters]
# Which implementation plugs into each port. `uv run docingest adapters` lists the
# built-ins plus any installed plugins (entry-point group "docingest.<port>").
detector = "magic"
pdf = "pdfium"
ocr = "mlx-vlm"            # or "openai-compatible" (vLLM, LM Studio, mlx_vlm.server, ...)
images = "pillow"
office = "docling"
latex = "pandoc"
text = "passthrough"
store = "filesystem"
qa = "paperqa"
crawler = "arxiv"
# Persistent chunk index (package docingest-index, `docingest index build`). The defaults
# are "none"; the real adapters also need the [embedder], [index] and [reranker] tables
# described in config/README.md. With index set, `docingest ask` retrieves from the index
# (embedder is then required; reranker "none" keeps the first stage's order); with "none"
# it asks PaperQA2 to retrieve, as before. See config/examples/lab-server.toml.
# embedder = "openai-compatible"
# index = "local"
# reranker = "vllm"

[routing]
min_chars = 50                  # page with fewer embedded chars -> OCR
image_coverage = 0.6            # image objects covering >60% of the page...
image_coverage_max_chars = 400  # ...with little text -> OCR
max_garbage_ratio = 0.10        # >10% broken glyphs (bad font encoding) -> OCR
min_alpha_ratio = 0.5           # olmOCR heuristic: <50% letters -> suspicious text layer

[ocr]
# Vision-language model used for scanned pages and images (MLX, runs on Apple Silicon).
# Pinned to an exact Hugging Face commit for reproducibility.
repo_id = "mlx-community/Qwen3-VL-4B-Instruct-4bit"
revision = "2fd8dacbdb8f1e54b8c005f081ec5bf79c56376b"
# repo_id and revision always change together (revision = a commit of that repo).
# Other benchmarked option (OCR-specialised Qwen2.5-VL-7B fine-tune, ~5.6 GB; see docs/benchmark.md):
# repo_id = "mlx-community/olmOCR-2-7B-1025-mlx-4bit"
# revision = "c0eaffb7844e795a44e246744cfaba5981a1bf03"
# Other verified MLX options (repo_id / revision):
#   mlx-community/Nanonets-OCR2-3B-4bit    fe1396cbeb46cc71cba355907b5d6e11f3553f45
#   mlx-community/Qwen3.5-4B-MLX-4bit      32f3e8ecf65426fc3306969496342d504bfa13f3
#   mlx-community/GLM-OCR-4bit             97f587506984cc92fa69b2694b4128e53db6b081
#   mlx-community/PaddleOCR-VL-1.6-4bit    c8987b277bdd8aaec8bd265d154f391bd03ad165
dpi = 150
temperature = 0.0
# max_tokens / repetition_penalty default to the profile's model-card values
profile = "markdown"       # prompt + image size + clean-up: markdown | olmocr | nanonets | glm-ocr | paddleocr-vl
# With ocr = "openai-compatible" in [adapters]:
# base_url = "http://127.0.0.1:8080/v1"
# served_model = "<output of: docingest model-path ocr>"   # mlx_vlm.server needs the snapshot path
# api_key_env = "OPENAI_API_KEY"                          # only for authenticated servers

[qa]
# PaperQA2 step. LLM defaults to the pinned [ocr] model (served by scripts/serve_llm.sh).
# Any litellm model works instead, e.g. llm = "ollama/llama3.1" with
# llm_base = "http://localhost:11434" and embedding = "ollama/mxbai-embed-large".
embedding_repo_id = "sentence-transformers/all-MiniLM-L6-v2"
embedding_revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
chunk_chars = 900   # target size; chunks over MiniLM's 256-token window are re-split by tokens
overlap = 100
evidence_k = 10
temperature = 0.0   # sent on every LLM request, so the same question gets the same answer

[latex]
timeout_s = 120        # pandoc wall-clock limit per document
max_archive_mb = 200   # refuse larger extracted sources (zip-bomb guard)
split_level = 2        # section depth that becomes one segment ("page")
fallback = true        # pylatexenc plain text (math verbatim) when pandoc fails or times out
# pandoc_path = "/opt/homebrew/bin/pandoc"   # native arm64 pandoc instead of the bundled one

[arxiv]
delay_s = 3.0          # arXiv API terms: at most one request every 3 seconds
retries = 3
# contact = "you@example.org"   # optional mailto in the User-Agent, as arXiv requests
prefer = ["latex", "pdf"]
